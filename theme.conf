[General]
# Palette. Everything in the theme is drawn from these; adding colours here is
# not the intent of the design.
background=#000000
accentColor=#00FF41
midColor=#00C832
dimColor=#008F11
rainHeadColor=#CFFFD8
# Reserved for status text that must not read as "green means fine".
neutralColor=#BFC6BF

# Monospace family to prefer. If it is not installed the theme falls back
# through JetBrains Mono, Fira Code, Hack, IBM Plex Mono and finally
# fontconfig's generic "monospace", so this is a preference, not a dependency.
fontFamily=JetBrainsMono Nerd Font Mono

# Profile image, relative to this theme directory. Ships with the theme; it is
# not read from anyone's home directory.
avatar=assets/pfp.png
avatarSize=120
showAvatar=true

# Leave empty to use "<HOSTNAME> // AUTHENTICATION".
headerText=
showHeader=true

showPowerActions=true
showSuspend=true
# auto: show each action only when the SDDM daemon reports it as available.
# always: show them regardless — useful when previewing with --test-mode.
powerVisibility=auto

# Rain. Deliberately terminal-sized: small glyphs, thin streams, dense field.
# rainColumnSpacing is a multiple of the glyph size, not a pixel value.
rainFontSize=13
rainColumnSpacing=1.65
rainMaxColumns=260
rainMinSpeed=45
rainMaxSpeed=165
rainOpacity=0.95
